name: TikTok test
# post-now/ folder ki tasveerein TikTok par (sirf test; approval se pehle post private rehti hai)
on:
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pillow
      - run: python tiktok_post.py test
