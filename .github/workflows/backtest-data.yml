name: Backtest Data

on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Poora purana data (pehli dafa) download karein?"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: backtest-data
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Data download
        run: |
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then
            python backtest_data.py --backfill
          else
            python backtest_data.py
          fi
      - name: Save to repo
        run: |
          git config user.name data-bot
          git config user.email data-bot@users.noreply.github.com
          git add data
          if git diff --cached --quiet; then echo "Kuch naya nahi"; exit 0; fi
          git commit -q -m "backtest data update"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 7))
          done
          echo "Push nahi ho saka"; exit 1
