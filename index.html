<!doctype html>
<html lang="ur">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Alexa — Daddy Trader</title>
<meta name="description" content="Daddy Trader — Alexa AI market analysis, Gold (XAUUSD) fundamentals, live signals aur free BackBar backtesting, sab aik jagah." />
<link rel="canonical" href="https://alex-zeee.github.io/daddy-trader-portfolio/" />
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#030806" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#030806; --fg:#eef3ef; --muted:#84968b; --line:rgba(130,210,165,.16);
    --emerald:#3cae77; --emerald-hi:#8fe3b5; --gold:#f5c542; --gold-hi:#ffe08a; --gold-deep:#b8860b;
    --dock-h:84px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:'Poppins',system-ui,sans-serif;overflow:hidden}

  /* ===== Alexa area ===== */
  #stage{position:fixed;inset:0 0 var(--dock-h) 0;background:var(--bg)}
  #alexaFrame{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:var(--bg);opacity:0;transition:opacity .5s}
  #stage.live #alexaFrame{opacity:1}
  #stage.live #webAlexa{display:none}

  /* ===== website wali Alexa ===== */
  #webAlexa{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    padding:22px 16px 12px;gap:10px;overflow:hidden;
    background:radial-gradient(60% 45% at 50% 22%,rgba(60,174,119,.16),transparent 70%),var(--bg)}
  .wa-tools{position:absolute;top:12px;right:12px;display:flex;gap:8px;z-index:2}
  .icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(8,18,13,.7);color:var(--emerald-hi);
    display:grid;place-items:center;cursor:pointer;padding:0}
  .icon-btn:hover{border-color:var(--emerald)}
  .icon-btn svg{width:18px;height:18px}
  #waMute .off{display:none}
  #waMute[aria-pressed="true"] .on{display:none}
  #waMute[aria-pressed="true"] .off{display:block}
  #waMute[aria-pressed="true"]{color:var(--muted)}

  .orb{flex:none;width:150px;height:150px;border-radius:50%;position:relative;margin:8px 0 4px;border:0;padding:0;cursor:pointer;
    background:#fff;display:grid;place-items:center;
    box-shadow:0 0 0 4px rgba(143,227,181,.55),0 0 60px rgba(60,174,119,.45),0 0 140px rgba(245,197,66,.18);
    animation:breathe 3.2s ease-in-out infinite;transition:box-shadow .3s}
  .orb img{width:84%;height:auto;display:block;pointer-events:none}
  .orb::before,.orb::after{content:"";position:absolute;inset:-16px;border-radius:50%;border:1px solid rgba(143,227,181,.28);animation:ring 3.2s ease-out infinite;pointer-events:none}
  .orb::after{animation-delay:1.6s}
  .orb[data-state="listening"]{box-shadow:0 0 0 5px var(--emerald-hi),0 0 70px rgba(60,174,119,.8)}
  .orb[data-state="listening"]::before,.orb[data-state="listening"]::after{border-color:var(--emerald-hi);animation-duration:1.2s}
  .orb[data-state="thinking"]{animation:none}
  .orb[data-state="thinking"]::before{inset:-10px;border:3px solid transparent;border-top-color:var(--gold);border-right-color:var(--gold-hi);animation:spin .9s linear infinite;opacity:1}
  .orb[data-state="speaking"]{animation:talk .5s ease-in-out infinite alternate;box-shadow:0 0 0 4px var(--gold-hi),0 0 70px rgba(245,197,66,.45)}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
  @keyframes ring{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.4);opacity:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes talk{from{transform:scale(1)}to{transform:scale(1.06)}}
  .name{font-size:36px;font-weight:800;letter-spacing:.32em;margin:0;padding-left:.32em;line-height:1.1;
    background:linear-gradient(90deg,var(--emerald-hi),var(--gold-hi));-webkit-background-clip:text;background-clip:text;color:transparent}
  .status{margin:0;font-size:13px;color:var(--muted);text-align:center;min-height:1.4em}

  #waLog{flex:1 1 auto;min-height:0;width:100%;max-width:680px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:6px 2px;
    scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .wa-line{max-width:88%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word}
  .wa-line.alexa{align-self:flex-start;background:rgba(8,18,13,.78);border:1px solid var(--line);color:var(--fg);border-bottom-left-radius:5px}
  .wa-line.you{align-self:flex-end;background:linear-gradient(135deg,rgba(60,174,119,.28),rgba(60,174,119,.16));color:var(--fg);border-bottom-right-radius:5px}

  #waForm{flex:none;width:100%;max-width:680px;display:flex;gap:8px;align-items:center}
  #waInput{flex:1;min-width:0;height:48px;border-radius:999px;border:1px solid var(--line);background:rgba(8,18,13,.85);color:var(--fg);
    padding:0 18px;font:500 15px 'Poppins',sans-serif;outline:none}
  #waInput:focus{border-color:var(--emerald)}
  #waInput::placeholder{color:var(--muted)}
  .round{flex:none;width:48px;height:48px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;color:#06120c}
  .round svg{width:22px;height:22px}
  #waMic{background:linear-gradient(135deg,var(--emerald-hi),var(--emerald))}
  #waSend{background:linear-gradient(135deg,var(--gold-hi),var(--gold))}

  /* ===== 2 buttons dock ===== */
  #dock{position:fixed;left:0;right:0;bottom:0;height:var(--dock-h);display:flex;align-items:center;justify-content:center;gap:16px;
    padding:0 16px env(safe-area-inset-bottom);background:linear-gradient(180deg,rgba(3,8,6,.92),#030806);
    border-top:1px solid var(--line);z-index:10}
  .btn{flex:0 1 300px;display:flex;align-items:center;gap:12px;height:60px;padding:0 18px;border-radius:18px;
    text-decoration:none;color:#06120c;position:relative;overflow:hidden;
    transition:transform .18s ease, box-shadow .18s ease}
  .btn::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);
    transform:translateX(-120%);transition:transform .6s ease}
  .btn:hover{transform:translateY(-3px)}
  .btn:hover::after{transform:translateX(120%)}
  .btn:active{transform:translateY(0) scale(.98)}
  .btn.fund{background:linear-gradient(135deg,var(--emerald-hi),var(--emerald));box-shadow:0 8px 26px rgba(60,174,119,.35)}
  .btn.back{background:linear-gradient(135deg,var(--gold-hi),var(--gold) 55%,var(--gold-deep));box-shadow:0 8px 26px rgba(245,197,66,.28)}
  .ic{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;background:rgba(3,8,6,.16)}
  .ic svg{width:22px;height:22px}
  .txt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
  .txt strong{font-size:17px;font-weight:700}
  .txt small{font-size:12px;font-weight:500;opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  @media (max-width:560px){
    :root{--dock-h:76px}
    #dock{gap:10px;padding:0 10px env(safe-area-inset-bottom)}
    .btn{height:54px;padding:0 12px;gap:9px;border-radius:15px;flex:1 1 0}
    .ic{width:34px;height:34px;border-radius:10px}
    .txt strong{font-size:15px}
    .txt small{display:none}
    .name{font-size:28px}
    .orb{width:112px;height:112px}
    #webAlexa{padding-top:14px;gap:8px}
    .wa-line{font-size:14px}
  }
  @media (prefers-reduced-motion:reduce){.orb,.orb::after{animation:none}.btn,.btn::after{transition:none}}
</style>
</head>
<body>

<main id="stage">
  <!-- Alexa jo aap ke laptop par chal rahi hai, wahi yahan dikhti hai -->
  <iframe id="alexaFrame" title="Alexa"
    allow="microphone; camera; autoplay; fullscreen; display-capture; clipboard-read; clipboard-write; local-network-access; local-network; loopback-network"></iframe>

  <section id="webAlexa" aria-label="Alexa">
    <div class="wa-tools">
      <button class="icon-btn" id="waMute" type="button" aria-pressed="false" title="Awaaz">
        <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>
      </button>
      <button class="icon-btn" id="waClear" type="button" title="Nayi baat shuru karein">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
    </div>
    <button class="orb" id="waOrb" type="button" data-state="idle" aria-label="Alexa se bolein"><img src="logo.webp" alt="Daddy Trader logo" width="646" height="470" /></button>
    <h1 class="name">ALEXA</h1>
    <p class="status" id="waStatus" aria-live="polite"></p>
    <div id="waLog" aria-live="polite"></div>
    <form id="waForm" autocomplete="off">
      <input id="waInput" type="text" placeholder="Alexa se poochiye… (jaise: gold ka analysis karo)" enterkeyhint="send" />
      <button class="round" id="waMic" type="button" aria-label="Bol kar poochiye">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
      </button>
      <button class="round" id="waSend" type="submit" aria-label="Bhejein">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
      </button>
    </form>
  </section>
</main>

<nav id="dock" aria-label="Website sections">
  <a class="btn fund" href="fundamental.html">
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/><circle cx="19" cy="8" r="1.4" fill="currentColor"/></svg></span>
    <span class="txt"><strong>Fundamental</strong><small>Daddy Trader — news &amp; signals</small></span>
  </a>
  <a class="btn back" href="backtest.html">
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4v16"/><rect x="4" y="8" width="4" height="7" rx="1"/><path d="M13 3v18"/><rect x="11" y="6" width="4" height="9" rx="1"/><path d="M20 6v13"/><rect x="18" y="10" width="4" height="6" rx="1"/></svg></span>
    <span class="txt"><strong>Backtest</strong><small>BackBar — chart replay</small></span>
  </a>
</nav>

<script src="alexa-web.js?v=2"></script>
<script>
(function(){
  // Laptop wali Alexa (alexa.py) on ho to wohi dikhe, warna website wali Alexa
  var ALEXA = 'http://127.0.0.1:8765/';
  var stage = document.getElementById('stage');
  var frame = document.getElementById('alexaFrame');
  var live = false;

  function ping(){
    var ctrl = ('AbortController' in window) ? new AbortController() : null;
    var t = setTimeout(function(){ if (ctrl) ctrl.abort(); }, 2500);
    return fetch(ALEXA + 'ui/ping', { mode:'no-cors', cache:'no-store', signal: ctrl ? ctrl.signal : undefined })
      .then(function(){ clearTimeout(t); return true; })
      .catch(function(){ clearTimeout(t); return false; });
  }
  frame.addEventListener('load', function(){ if (live) stage.classList.add('live'); });

  function check(){
    ping().then(function(ok){
      if (ok && !live){
        if (window.AlexaWeb && AlexaWeb.busy()) return;      // website wali Alexa baat kar rahi ho to us ke baad
        if (window.AlexaWeb) AlexaWeb.stop();
        live = true; frame.src = ALEXA + '?v=' + Date.now();
      } else if (!ok && live){
        live = false; stage.classList.remove('live'); frame.removeAttribute('src');
      }
    });
  }
  check();
  setInterval(check, 6000);
})();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
